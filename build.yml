name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project
        run: |
          if [ -f DriveDeck-project.zip ]; then
            unzip -q -o DriveDeck-project.zip -d proj
            echo "DIR=proj/DriveDeck" >> "$GITHUB_ENV"
          else
            echo "DIR=." >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build release APK
        working-directory: ${{ env.DIR }}
        run: gradle assembleRelease --no-daemon
      - name: Copy APK
        run: cp "$DIR/app/build/outputs/apk/release/app-release.apk" DriveDeck.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DriveDeck-apk
          path: DriveDeck.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DriveDeck build ${{ github.run_number }}
          files: DriveDeck.apk
